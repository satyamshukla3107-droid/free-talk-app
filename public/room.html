<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FreeTalk - Call Room</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <meta name="theme-color" content="#0b0f19">
</head>
<body>
  <div class="room-container">
    <!-- Top Header -->
    <header class="room-header">
      <div class="room-header-left">
        <span class="room-header-logo">FreeTalk</span>
        <button id="btnCopyRoom" class="room-code-tag" title="Click to copy room link" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="roomCodeDisplay">Room</span>
        </button>
      </div>

      <div class="room-header-right">
        <div class="participant-count">
          <span class="online-dot"></span>
          <span id="participantCountText">1 online</span>
        </div>
        <button id="btnShareInvite" class="header-btn" title="Share invite link" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>Invite</span>
        </button>
      </div>
    </header>

    <!-- Room Body: Video Grid + Chat Drawer -->
    <main class="room-body">
      <!-- Video Grid Area -->
      <section class="video-section">
        <div id="videoGrid" class="video-grid grid-1">
          <!-- Local User Video Card -->
          <div id="localVideoContainer" class="video-card local-video">
            <video id="localVideo" autoplay playsinline muted></video>
            <div id="localPlaceholder" class="video-placeholder" style="display: none;">
              <div id="localAvatar" class="avatar-circle">U</div>
            </div>
            <div class="video-user-badge">
              <span id="localUsernameBadge">You</span>
            </div>
            <div id="localMuteBadge" class="audio-status-badge" style="display: none;" title="Mic muted">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </div>
          </div>
          <!-- Remote videos dynamically inserted here -->
        </div>
      </section>

      <!-- Chat Drawer -->
      <aside id="chatDrawer" class="chat-drawer">
        <div class="chat-header">
          <span class="chat-title">Messages</span>
          <button id="btnCloseChat" class="close-chat-btn" title="Close chat" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div id="chatMessages" class="chat-messages">
          <div class="chat-system-msg">Room me aapka swagat hai! Link share karke dosto ko bulayein.</div>
        </div>

        <!-- Quick Emojis -->
        <div class="quick-emojis">
          <button class="quick-emoji-btn" data-emoji="👍">👍</button>
          <button class="quick-emoji-btn" data-emoji="❤️">❤️</button>
          <button class="quick-emoji-btn" data-emoji="😂">😂</button>
          <button class="quick-emoji-btn" data-emoji="🔥">🔥</button>
          <button class="quick-emoji-btn" data-emoji="👏">👏</button>
          <button class="quick-emoji-btn" data-emoji="👋">👋</button>
        </div>

        <!-- Message Input -->
        <form id="chatForm" class="chat-input-area">
          <input type="text" id="chatInput" class="chat-input" placeholder="Message likhein..." autocomplete="off">
          <button type="submit" class="chat-send-btn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </aside>
    </main>

    <!-- Bottom Controls -->
    <footer class="room-controls">
      <!-- Mic Button -->
      <button id="btnToggleMic" class="control-btn" title="Mute/Unmute Mic" type="button">
        <svg id="iconMicOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <svg id="iconMicOff" style="display:none;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Camera Button -->
      <button id="btnToggleCam" class="control-btn" title="Camera On/Off" type="button">
        <svg id="iconCamOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <svg id="iconCamOff" style="display:none;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>

      <!-- Flip Camera Button (for mobile phones) -->
      <button id="btnFlipCam" class="control-btn" title="Switch Camera" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16l-4 4-4-4"></path>
          <path d="M4 8l4-4 4 4"></path>
          <path d="M16 20V8a4 4 0 0 0-4-4H4"></path>
          <path d="M8 4v12a4 4 0 0 0 4 4h8"></path>
        </svg>
      </button>

      <!-- Screen Share Button -->
      <button id="btnScreenShare" class="control-btn" title="Share Screen" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </button>

      <!-- Chat Drawer Toggle -->
      <button id="btnToggleChat" class="control-btn" title="Toggle Chat" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="unreadBadge" class="badge-unread">0</span>
      </button>

      <!-- Leave Call Button -->
      <button id="btnLeaveCall" class="control-btn leave-btn" title="Leave Call" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
          <line x1="23" y1="1" x2="1" y2="23"></line>
        </svg>
      </button>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Socket.io library -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Room controller -->
  <script src="/js/room.js"></script>
</body>
</html>
