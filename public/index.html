<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FreeTalk - Ekdam Free Calling & Chat App</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="100% Free Video call, Voice call aur Real-time Text chat app. No ads, No limits.">
</head>
<body>
  <div class="landing-container">
    <div class="brand-header">
      <div class="brand-logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>FreeTalk</span>
      </div>
      <p class="brand-tagline">100% Free Video, Voice & Real-time Chat</p>
      <span class="free-badge">Zero Cost • Unlimited Time • P2P Secure</span>
    </div>

    <div class="landing-card">
      <!-- Media Preview Before Joining -->
      <div class="preview-box">
        <video id="previewVideo" class="preview-video" autoplay playsinline muted></video>
        <div id="previewAvatar" class="preview-avatar" style="display: none;">👤</div>
        <div class="preview-controls">
          <button id="togglePreviewMic" class="mini-btn" title="Toggle Mic" type="button">
            <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <button id="togglePreviewCam" class="mini-btn" title="Toggle Camera" type="button">
            <svg id="camIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </button>
        </div>
      </div>

      <!-- User Name Input -->
      <div class="form-group">
        <label class="form-label" for="usernameInput">Aapka Naam (Your Name)</label>
        <input type="text" id="usernameInput" class="form-input" placeholder="e.g. Rahul, Priya, Amit" maxlength="25" autocomplete="name" required>
      </div>

      <!-- Action Tabs -->
      <div class="tab-nav">
        <button id="tabCreate" class="tab-btn active" type="button">Naya Room Banayein</button>
        <button id="tabJoin" class="tab-btn" type="button">Room Join Karein</button>
      </div>

      <!-- Section: Create Room -->
      <div id="sectionCreate">
        <button id="btnCreateRoom" class="btn-primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          Instant Call Shuru Karein
        </button>
      </div>

      <!-- Section: Join Existing Room -->
      <div id="sectionJoin" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="roomInput">Room Code ya Link Dalein</label>
          <input type="text" id="roomInput" class="form-input" placeholder="e.g. meet-xyz-123">
        </div>
        <button id="btnJoinRoom" class="btn-primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Room Join Karein
        </button>
      </div>

      <!-- Highlight Features -->
      <div class="feature-pills">
        <span class="feature-pill">📱 Mobile & PC Friendly</span>
        <span class="feature-pill">🎥 HD Video Call</span>
        <span class="feature-pill">🎙️ Clear Voice Call</span>
        <span class="feature-pill">💬 Instant Text Chat</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/index.js"></script>
</body>
</html>
